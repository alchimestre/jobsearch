# jobradar config — every key is optional; defaults live in src/jobradar/config.py.
# Delete a key to fall back to the default.

# Post-action hooks. Run when a posting is marked in the TUI (`s` shortlist / `a` applied
# / `x` ignore) or through `jobradar mark`. The command gets the posting as JSON on
# stdin plus JOBRADAR_* env vars; relative paths resolve against this repo; exit 0 is
# success. Keys are statuses: applied, shortlist, ignored, rejected, new.
hooks:
  applied: python3 /Users/vincent/projects/jobsearch/scripts/log_applied.py

db: .jobradar/state.db
companies_file: companies.yaml
timeout: 25
min_score: 3          # postings scoring below this are not stored at all
cache_minutes: 0      # >0 skips a source that was fetched within N minutes

# Admission scope. JD language is detected from the description (umlauts/stopwords),
# geography from the location string. Anything outside these lists is stored with
# decision "out" — visible via `jobradar list --decision out`, never shown by default.
#   languages: en | fr | de | unknown      regions: eu | emea | au | americas | apac | unknown
# Hard rule since 2026-10-09: the job description MUST be written in English or French.
# `unknown` is excluded too, because a short German JD can fail detection and slip through.
allowed_languages: [en, fr]
allowed_regions: [eu, emea, au, unknown]

# Where the work happens. A hybrid/on-site posting must be in one of these countries;
# a remote one must name one of them or a broad region that includes them
# (EU / EMEA / Europe / worldwide / anywhere), else it is excluded. A remote posting
# with no geography at all is kept and tagged `-geo-unverified`.
#   countries: fr | de | ch | nl
target_countries: [fr, de, ch, nl]

# Aggregator feeds. `type` selects an adapter from FEED_FETCHERS in
# src/jobradar/sources/__init__.py. Add `company: <name>` to an rss entry when the feed
# title is not the employer; add `enrich_limit: N` when the feed carries a teaser only.
feeds:
  - name: hn-whoishiring
    type: hn
    url: https://hn.algolia.com/api/v1/search_by_date?tags=story,author_whoishiring&hitsPerPage=6
  # The site-wide feed carries every category (87 items) in one request; the per-category
  # feeds 301 and one of them redirects nowhere usable.
  - name: weworkremotely
    type: rss
    url: https://weworkremotely.com/remote-jobs.rss
  - name: euremotejobs
    type: rss
    url: https://euremotejobs.com/feed/
  - name: swissdevjobs
    type: rss
    url: https://swissdevjobs.ch/rss
  # Muted: 28 rows fetched, 0 in scope — every JD is German, which the language filter drops.
  - name: germantechjobs
    type: rss
    url: https://germantechjobs.de/rss
    enabled: false
  - name: remoteok
    type: remoteok
    url: https://remoteok.com/api
  - name: arbeitnow
    type: arbeitnow
    url: https://www.arbeitnow.com/api/job-board-api
  - name: cryptojobslist
    type: rss
    url: https://cryptojobslist.com/rss
  # Teaser-only feed: the posting page has to be read before the JD-language gate
  # can run. `enrich_limit` is the number of page fetches per scan, not per posting.
  - name: cryptocurrencyjobs
    type: rss
    url: https://cryptocurrencyjobs.co/index.xml
    enrich_limit: 15
  # Sitemap discovery plus one page fetch per posting, so `max_items` is a request budget.
  - name: lesjeudis
    type: lesjeudis
    max_items: 40
  - name: free-work
    type: free_work
    contracts: [contractor]
    items_per_page: 100
    max_pages: 2
    max_items: 200
  # --- Global remote
  - name: jobicy
    type: jobicy
    count: 100
    max_pages: 2
  - name: himalayas
    type: himalayas
    limit: 20
    max_pages: 3
  - name: workingnomads
    type: workingnomads
    max_items: 60
  - name: landingjobs
    type: landingjobs
    limit: 20
    max_pages: 2
  - name: jobdataapi-fr
    type: jobdataapi
    country_code: FR
    max_pages: 1
  # Both answers 499/403 to an unknown client and need a browser user agent.
  # Muted: UK postings fall outside the region gate, so the feed returned 0 in-scope rows.
  - name: devitjobs-uk
    type: devitjobs
    user_agent: browser
    enabled: false
  - name: themuse
    type: themuse
    user_agent: browser
    max_pages: 1
  # --- Web3
  - name: lobsters-whoishiring
    type: lobsters
    max_items: 40
  # Keyed: skipped, and named in the scan summary, until `.env` beside this file holds a value.
  - name: web3career
    type: web3career
    token: ${WEB3CAREER_KEY}
    limit: 100

# Scoring. [regex, weight, tag]. Hard negatives (see HARD_NEGATIVES in filters.py)
# always apply; soft ones only apply when no strong target title is present.
title_rules:
  - ["\\bml ?ops\\b", 6, mlops]
  - ["\\bml ?platform\\b", 6, ml-platform]
  - ["\\bmachine learning platform\\b", 6, ml-platform]
  - ["\\bml ?infrastructure\\b", 6, ml-infra]
  - ["\\bai infrastructure\\b", 5, ai-infra]
  - ["\\bai platform\\b", 5, ai-platform]
  - ["\\b(ml|ai) (engineer|engineering)\\b", 3, ai-ml]
  - ["\\bplatform engineer", 4, platform]
  - ["\\bsite reliability engineer\\b|\\bsre\\b", 3, sre]
  - ["\\binfrastructure engineer", 3, infra]
  - ["\\btraining platform\\b|\\binference platform\\b|\\bserving platform\\b", 5, serving]
  - ["\\bkubernetes\\b|\\bk8s\\b", 2, k8s]
  - ["\\bdevops\\b", 2, devops]
  - ["\\bcloud engineer", 2, cloud]
  - ["\\bforward deployed\\b|\\bdeployment engineer\\b|\\bsolutions engineer\\b", 2, fwd-deployed]
  - ["\\breliability\\b", 1, reliability]
  - ["\\bobservability\\b", 1, observability]
  # Web3 infrastructure — admitted lane; weighted below ML/MLOps deliberately.
  - ["\\bweb3\\b|\\bweb ?3\\b", 3, web3]
  - ["\\bblockchain\\b", 3, blockchain]
  - ["\\bcrypto\\b|\\bcryptocurrency\\b|\\bdigital assets?\\b", 2, crypto]
  - ["\\bprotocol engineer\\b|\\bprotocols? (infra|infrastructure|engineering)\\b", 3, protocol]
  - ["\\bvalidator\\b|\\bstaking\\b|\\bnode operator\\b", 3, staking]
  - ["\\bdefi\\b|\\bdex\\b|\\brollup\\b|\\blayer ?2\\b|\\bsmart contracts?\\b|\\bsolidity\\b|\\bevm\\b", 3, web3-tech]
  - ["\\bindexer\\b|\\brpc\\b|\\bcustody\\b|\\bwallet infrastructure\\b", 2, web3-infra]

negative_rules:
  - ["\\bintern\\b|\\bworking student\\b|\\bwerkstudent\\b|\\bapprentice", -8, intern]
  - ["\\b(head|director|vp|chief|president)\\b", -5, leadership]
  - ["\\bengineering manager\\b|\\bproduct manager\\b|\\bprogram manager\\b", -5, non-ic]
  - ["\\bsales\\b|\\baccount executive\\b|\\bcustomer success\\b|\\brecruiter\\b|\\bmarketing\\b", -6, go-to-market]
  - ["\\bgrowth\\b|\\bpartnerships?\\b|\\bcommunity\\b|\\bbusiness development\\b|\\bevangelist\\b", -6, go-to-market]
  - ["\\bcompliance\\b|\\blegal\\b|\\bfinance\\b|\\baccounting\\b|\\baudit\\b|\\btalent\\b|\\bpeople ops\\b|\\bcounsel\\b", -6, non-engineering]
  - ["\\bfrontend\\b|\\bmobile\\b|\\bios\\b|\\bandroid\\b|\\bqa\\b|\\btest engineer\\b", -5, off-target]
  # Vincent is not a developer: code-grounded roles are out, not merely lower (2026-10-09).
  - ["\\b(software|back ?end|full ?stack|front ?end) (engineer|developer)\\b|\\bsde\\b", -6, software-role]
  - ["\\bdata scientist\\b|\\bdata analyst\\b|\\bbusiness analyst\\b", -4, off-target]
  - ["\\bdata engineer\\b|\\bdataops\\b|\\banalytics engineer\\b", -2, data-pipeline]
  - ["\\bstaff\\b|\\bprincipal\\b", -6, seniority-stretch]
